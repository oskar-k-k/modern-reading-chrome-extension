<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modern Reading</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="mark" aria-hidden="true">M<span>r</span></div>
      <div><h1 data-copy="title"></h1><p class="intro" data-copy="intro"></p></div>
    </header>
    <section class="controls">
      <label class="toggle primary"><span data-copy="automatic"></span><input id="automatic" type="checkbox" role="switch" disabled></label>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <details id="advanced">
      <summary data-copy="advanced"></summary>
      <div class="advanced-content">
        <label class="toggle"><span data-copy="excluded"></span><input id="excluded" type="checkbox" disabled></label>
        <label class="field"><span data-copy="strength"></span><output id="fraction-value" for="fraction"></output><input id="fraction" type="range" min="20" max="70" step="5" value="50"></label>
        <section class="preview"><h2 data-copy="preview"></h2><p id="preview"></p></section>
        <label class="field"><span data-copy="minimum"></span><select id="minimum"><option value="40">40</option><option value="120">120</option><option value="250">250</option><option value="500">500</option><option value="1000">1000</option></select></label>
        <label class="field"><span data-copy="language"></span><select id="locale"><option value="en">English</option><option value="de">Deutsch</option></select></label>
        <button id="reset" type="button" data-copy="reset"></button>
        <footer>
          <p data-copy="privacy"></p>
          <p data-copy="accessInfo"></p>
          <p data-copy="readingInfo"></p>
          <p><span data-copy="version"></span> <span id="version"></span></p>
        </footer>
      </div>
    </details>
  </main>
  <script src="popup.js"></script>
</body>
</html>
